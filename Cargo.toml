[workspace]
members = [
  "sdk/foundation/cyber-pumpkin-core",
  "sdk/filesystem/cyber-pumpkin-backend",
  "sdk/filesystem/cyber-pumpkin-local",
  "sdk/application/cyber-pumpkin-application",
  "sdk/ssh/cyber-pumpkin-sftp",
  "sdk/ssh/cyber-pumpkin-ssh",
  "sdk/operations/cyber-pumpkin-operations",
  "sdk/operations/cyber-pumpkin-scheduler",
  "sdk/reliability/cyber-pumpkin-reliability",
  "sdk/decisions/cyber-pumpkin-decisions",
  "sdk/history/cyber-pumpkin-history",
  "sdk/security/cyber-pumpkin-secrets",
  "sdk/rules/cyber-pumpkin-rules",
  "sdk/sync/cyber-pumpkin-sync-plan",
  "sdk/sync/cyber-pumpkin-sync",
  "sdk/transfer/cyber-pumpkin-transfer",
  "sdk/transfer/cyber-pumpkin-transfer-runtime",
  "tools/cpk",
  "apps/cyber-pumpkin/linux",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
authors = ["Adam Vadala-Roth"]
repository = "https://github.com/adamjvr/Cyber-Pumpkin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
