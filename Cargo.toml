[workspace]
members = [
  "crates/cyber-pumpkin-core",
  "crates/cyber-pumpkin-transfer",
  "crates/cpk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
authors = ["Adam Vadala-Roth"]
repository = "https://github.com/adamjvr/Cyber-Pumpkin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
